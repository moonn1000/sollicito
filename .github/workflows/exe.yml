# Construit l'exe autonome d'un seul fichier tel que la publication le construira, puis le contrôle, le lance et
# prépare en essai les fichiers d'une version (ADR-0009). La CI l'appelle deux fois, et la seconde construction,
# dans un autre dossier, doit donner la même empreinte. La publication l'appelle sur l'étiquette d'une version.
# Aucun secret : le jeton ne peut que lire le dépôt. Aucun cache : rien d'un autre run n'entre dans l'exe.
# Les actions sont épinglées par empreinte de commit, leur version en commentaire.
name: Exe

on:
  workflow_call:
    inputs:
      dossier:
        description: Dossier de la copie du dépôt, sous l'espace de travail du runner.
        type: string
        default: "."
      complet:
        description: Contrôler l'exe, le lancer et préparer en essai les fichiers d'une version ; sinon, calculer seulement son empreinte.
        type: boolean
        default: true
      artefact:
        description: >-
          Artefact du run, 7 jours : « non-publie » (push sur main), « candidat » (publication, sur une étiquette),
          ou vide (pull request : aucun artefact).
        type: string
        default: ""
    outputs:
      empreinte:
        description: Empreinte SHA-256 de l'exe, en hexadécimal minuscule.
        value: ${{ jobs.construire.outputs.empreinte }}
      artefact:
        description: Nom de l'artefact du run, vide s'il n'y en a pas.
        value: ${{ jobs.construire.outputs.artefact }}

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  construire:
    name: Construire
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      empreinte: ${{ steps.empreinte.outputs.empreinte }}
      artefact: ${{ steps.artefact.outputs.nom }}
    defaults:
      run:
        shell: pwsh
        working-directory: ${{ inputs.dossier }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ inputs.dossier }}
          persist-credentials: false

      - name: Installer le SDK .NET fixé par global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: ${{ inputs.dossier }}/global.json

      - name: Installer pnpm, version fixée par package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.dossier }}/interface/package.json
          standalone: true

      # Node.js est fourni par pnpm, à la version de package.json (devEngines.runtime). Une commande par étape :
      # pwsh ne rend que le code de sortie de la dernière.
      - name: Installer les dépendances du fichier de verrouillage
        working-directory: ${{ inputs.dossier }}/interface
        run: pnpm install --frozen-lockfile

      - name: Construire l'interface
        working-directory: ${{ inputs.dossier }}/interface
        run: pnpm run build

      # Restauration en mode verrouillé et ContinuousIntegrationBuild (CI=true, voir Directory.Build.props).
      - name: Publier l'exe
        run: dotnet publish src/Sollicito.Fenetre/Sollicito.Fenetre.csproj -c Release -o "$env:RUNNER_TEMP/publication"

      # La publication ne réécrit aucun fichier suivi, verrous NuGet compris (voir Sollicito.Fenetre.csproj).
      - name: Vérifier que la publication n'a rien réécrit
        run: git diff --exit-code

      - name: Calculer l'empreinte SHA-256
        id: empreinte
        run: |
          $empreinte = (Get-FileHash -Algorithm SHA256 -LiteralPath "$env:RUNNER_TEMP/publication/Sollicito.exe").Hash.ToLowerInvariant()
          "Empreinte SHA-256 de Sollicito.exe : $empreinte"
          "empreinte=$empreinte" >> $env:GITHUB_OUTPUT

      - name: Contrôler l'exe
        if: inputs.complet
        run: ./.github/scripts/verifier-exe.ps1 -Dossier "$env:RUNNER_TEMP/publication"

      - name: Lancer l'exe seul dans un dossier vide
        if: inputs.complet
        run: ./.github/scripts/lancer-exe.ps1 -Exe "$env:RUNNER_TEMP/publication/Sollicito.exe"

      - name: Rassembler l'exe et son empreinte
        if: inputs.complet
        env:
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          $dossier = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/artefact" -Force
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/publication/Sollicito.exe" -Destination $dossier
          # Format de sha256sum : l'empreinte, deux espaces, le nom du fichier.
          [IO.File]::WriteAllText((Join-Path $dossier 'Sollicito.exe.sha256'), "$env:EMPREINTE  Sollicito.exe`n")

      # Le même script que la publication, sur une version d'essai : il s'arrête avant l'attestation et l'envoi.
      - name: Préparer les fichiers d'une version, en essai
        if: inputs.complet
        shell: bash
        env:
          EMPREINTE: ${{ steps.empreinte.outputs.empreinte }}
        run: |
          temp="$(cygpath -u "$RUNNER_TEMP")"
          bash .github/scripts/preparer-les-fichiers.sh 0.0.0 "$temp/artefact" "$EMPREINTE" "$temp/essai-de-version"

      - name: Nommer l'artefact
        id: artefact
        if: inputs.complet && inputs.artefact != ''
        env:
          SORTE: ${{ inputs.artefact }}
        run: |
          if ($env:SORTE -ceq 'non-publie') {
            $nom = "exe-non-publie-$($env:GITHUB_SHA.Substring(0, 7))"
          }
          elseif ($env:SORTE -ceq 'candidat' -and $env:GITHUB_REF -cmatch '^refs/tags/(v[0-9]+\.[0-9]+\.[0-9]+)\z') {
            $nom = "exe-candidat-$($Matches[1])"
          }
          else {
            throw "Artefact inattendu : « non-publie » sur main, « candidat » sur une étiquette de version."
          }
          "Artefact : $nom"
          "nom=$nom" >> $env:GITHUB_OUTPUT

      # Visible par tout compte GitHub connecté, sur un dépôt public : jamais pour une pull request.
      - name: Garder l'exe en artefact, 7 jours
        if: inputs.complet && inputs.artefact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artefact.outputs.nom }}
          path: ${{ runner.temp }}/artefact
          retention-days: 7
          if-no-files-found: error
          # Le paquet de l'exe est déjà compressé.
          compression-level: 0
