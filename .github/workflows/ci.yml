# Construit et teste la solution .NET et l'interface à chaque pull request vers main,
# puis après chaque fusion, pilote la vraie fenêtre par Playwright, et construit l'exe tel
# que la publication le construira (exe.yml). Aucun secret : le jeton du workflow ne peut
# que lire le dépôt.
# Les actions sont épinglées par empreinte de commit, leur version en commentaire.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"

jobs:
  dotnet:
    name: .NET
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer le SDK .NET fixé par global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      # Les machines de la CI sont en UTC : l'API et la page y liraient l'heure saisie dans le même fuseau, et aucun
      # test ne verrait une API qui la lirait en UTC (#80, point 2). Bruxelles : UTC+1 l'hiver, UTC+2 l'été.
      - name: Régler le fuseau du poste sur Bruxelles
        run: tzutil /s "Romance Standard Time"

      # Restauration en mode verrouillé (CI=true, voir Directory.Build.props), construction, tests.
      - name: Construire et tester
        run: dotnet test --solution Sollicito.slnx

  interface:
    name: Interface
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: interface
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer pnpm, version fixée par package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: interface/package.json
          standalone: true

      # Node.js est fourni par pnpm, à la version de package.json (devEngines.runtime).
      - name: Installer les dépendances du fichier de verrouillage
        run: pnpm install --frozen-lockfile

      - name: Construire et tester
        run: pnpm run check

  # La vraie fenêtre, pilotée par Playwright (interface/tests-fenetre) : l'interface construite,
  # l'exe en version de test (configuration Test, protocole CDP ouvert), puis le parcours
  # principal. Le runtime WebView2 Evergreen est celui de l'image du runner.
  fenetre:
    name: Fenêtre
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        working-directory: interface
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer le SDK .NET fixé par global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Installer pnpm, version fixée par package.json
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: interface/package.json
          standalone: true

      - name: Installer les dépendances du fichier de verrouillage
        run: pnpm install --frozen-lockfile

      # Le même fuseau que dans le job .NET : la page et l'API doivent le partager, hors UTC (#80, point 2).
      - name: Régler le fuseau du poste sur Bruxelles
        run: tzutil /s "Romance Standard Time"

      - name: Piloter la vraie fenêtre
        run: pnpm run test:fenetre

  # L'exe autonome d'un seul fichier : construit, contrôlé, lancé ; gardé 7 jours en artefact sur les seuls push
  # vers main, jamais pour une pull request (ADR-0009).
  # Un workflow réutilisable du dépôt se lit au commit du run, jamais sur le disque du runner. La syntaxe « $/ »
  # que propose zizmor date de juillet 2026, et actionlint 1.7.12 la refuse : « ./ » reste.
  exe:
    name: Exe
    uses: ./.github/workflows/exe.yml # zizmor: ignore[self-repository]
    with:
      artefact: ${{ github.event_name == 'push' && 'non-publie' || '' }}

  # Le même commit, construit dans un autre dossier : seule son empreinte sert.
  exe-ailleurs:
    name: Exe, autre dossier
    uses: ./.github/workflows/exe.yml # zizmor: ignore[self-repository]
    with:
      dossier: ailleurs/sollicito
      complet: false

  reproductibilite:
    name: Reproductibilité
    needs: [exe, exe-ailleurs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Comparer les empreintes des deux constructions
        env:
          PREMIERE: ${{ needs.exe.outputs.empreinte }}
          SECONDE: ${{ needs.exe-ailleurs.outputs.empreinte }}
        run: |
          echo "Première construction : $PREMIERE"
          echo "Seconde construction, autre dossier : $SECONDE"
          if [ -z "$PREMIERE" ] || [ "$PREMIERE" != "$SECONDE" ]; then
            echo "Les deux constructions du même commit ne donnent pas le même exe."
            exit 1
          fi

  # La publication à blanc, sans id-token ni écriture : la garde, éprouvée sur des refs admises et refusées, et la
  # configuration de release-please. La préparation des fichiers se fait dans le job « Exe ». Rien ne s'atteste,
  # rien ne s'envoie.
  publication-a-blanc:
    name: Publication, à blanc
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Récupérer le dépôt, avec l'historique de main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Éprouver la garde de la publication
        run: bash .github/scripts/tester-la-garde.sh

      # Le contrôle des déclencheurs lit les workflows en YAML : yq 4.54.3, téléchargé, empreinte vérifiée.
      - name: Installer yq 4.54.3
        run: |
          mkdir -p "$RUNNER_TEMP/outils"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/outils/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          echo "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973  $RUNNER_TEMP/outils/yq" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/outils/yq"
          "$RUNNER_TEMP/outils/yq" --version

      - name: Contrôler la configuration de release-please
        run: YQ="$RUNNER_TEMP/outils/yq" bash .github/scripts/tester-la-version.sh

  # Seule vérification à rendre obligatoire : elle échoue dès qu'un job ci-dessus n'a pas réussi.
  verdict:
    name: Verdict
    if: always()
    needs: [dotnet, interface, fenetre, exe, exe-ailleurs, reproductibilite, publication-a-blanc]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Exiger la réussite de chaque job
        env:
          RESULTATS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTATS"
          for resultat in $RESULTATS; do
            if [ "$resultat" != "success" ]; then
              exit 1
            fi
          done
